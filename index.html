<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e54c1">
<title>Maritime Procurement — Dashboard Operativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ====== DESIGN TOKENS (Plancia) ====== */
  :root{
    --c-peppino:#c8362f; --c-peppino-soft:#fbeae9;
    --c-liguria:#117a3a; --c-liguria-soft:#e6f3eb;
    --c-toscana:#1565c0; --c-toscana-soft:#e7f0fb;
    --c-norrbotten:#1a2c5e; --c-norrbotten-soft:#e7eaf1;
    --c-ufficio:#7c3aed; --c-ufficio-soft:#f3eefb;
    --accent:#0e54c1;
    --bg:#eef1f5; --surface:#fff; --border:#e6eaef; --line:#f3f5f8;
    --text:#14181f; --muted:#6b7280; --faint:#9aa3af;
    --red:#c8222a; --red-fg:#a01b22; --amber:#9a4a00; --amber-soft:#fbe6c8;
    --green:#1f7a2a; --purple:#6d28d9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;}
  ::-webkit-scrollbar{height:10px;width:10px;} ::-webkit-scrollbar-thumb{background:#c4ccd6;border-radius:6px;}
  a{color:inherit;text-decoration:none;}

  /* header / nav */
  .hd{background:var(--surface);border-bottom:1px solid #e3e8ee;position:sticky;top:0;z-index:20;}
  .hd-in{max-width:1340px;margin:0 auto;height:60px;display:flex;align-items:center;padding:0 28px;gap:16px;}
  .logo{display:flex;align-items:center;gap:9px;cursor:pointer;}
  .logo-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;}
  .sync{display:flex;align-items:center;gap:7px;border-radius:7px;padding:5px 11px;font-size:12px;font-weight:500;}
  .sync.ok{background:#e8f5ec;border:1px solid #cfe9d8;color:#145f1f;}
  .sync.warn{background:#fff7ec;border:1px solid #f0d9b0;color:#9a4a00;}
  .sync.err{background:#fce8ea;border:1px solid #f0c9cc;color:#a01b22;}
  .sync .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
  .btn{border:1px solid #d8dee5;background:#fff;border-radius:8px;height:36px;padding:0 14px;font-size:13px;font-weight:500;color:#374151;}
  .btn.primary{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:600;}
  .nav{background:var(--surface);border-bottom:1px solid #e3e8ee;position:sticky;top:60px;z-index:19;}
  .nav-in{max-width:1340px;margin:0 auto;height:50px;display:flex;align-items:center;padding:0 28px;gap:6px;}
  .tab{font-size:13.5px;font-weight:500;color:var(--muted);padding:7px 13px;border-radius:8px;cursor:pointer;}
  .tab.active{font-weight:600;color:var(--accent);background:#eaf1fc;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:20px;cursor:pointer;border:1px solid transparent;}
  .chip .cd{width:8px;height:8px;border-radius:50%;}
  .wrap{max-width:1340px;margin:0 auto;padding:26px 28px 64px;}
  .sect-label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8a93a0;margin-bottom:12px;}
  .row-between{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}

  /* hero */
  .hero{display:grid;grid-template-columns:1.25fr 1.25fr 1fr;gap:14px;margin-bottom:30px;}
  .hero-card{background:#fff;border:1px solid var(--border);border-radius:11px;padding:19px 22px;cursor:pointer;box-shadow:0 1px 2px rgba(20,30,50,.05);}
  .hero-card .lbl{font-size:12px;font-weight:700;letter-spacing:.04em;margin-bottom:8px;}
  .hero-num{font-size:50px;font-weight:600;line-height:.95;}
  .hero-cta{margin-top:14px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#fff;font-weight:600;padding:6px 12px;border-radius:7px;}
  .ministat{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
  .ministat .n{font-size:26px;font-weight:600;}

  /* fleet */
  .fleet{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:30px;}
  .vcard{background:#fff;border:1px solid #eceff3;border-radius:11px;padding:16px 17px;cursor:pointer;box-shadow:0 1px 2px rgba(20,30,50,.05);transition:opacity .15s,box-shadow .15s;}
  .vcard:hover{box-shadow:0 3px 12px rgba(20,30,50,.12);}
  .vcard .vh{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;}
  .vcard .vn{font-size:14px;font-weight:700;}
  .vstate{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;}
  .vtype{font-size:11.5px;color:var(--faint);margin-bottom:14px;}
  .vkpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
  .vkpis .kl{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;}
  .vkpis .kv{font-size:20px;font-weight:600;}
  .vfoot{display:flex;align-items:center;gap:6px;padding-top:11px;border-top:1px solid var(--line);}
  .vfoot .loc{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .vfoot .eta{margin-left:auto;flex:none;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:#eef2f6;color:#475569;}

  /* tables / action grid */
  .panel{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(20,30,50,.04);}
  .ghead{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#aab2bd;}
  .grp{display:flex;align-items:center;gap:9px;padding:10px 18px;background:#fff;border-bottom:1px solid #eef1f4;border-top:1px solid var(--line);}
  .grp .sq{width:9px;height:9px;border-radius:2px;}
  .grp .gt{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;}
  .grp .gc{font-size:11px;font-weight:600;color:#fff;padding:1px 8px;border-radius:20px;}
  .arow{align-items:center;border-bottom:1px solid var(--line);}
  .arow:hover{background:#fcfcfd;}
  .tchip{font-size:9.5px;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:5px;white-space:nowrap;}
  .vpill{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;}
  .vpill .cd{width:7px;height:7px;border-radius:50%;}
  .adesc{font-size:13px;color:#3a4250;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .whenb{font-size:11px;font-weight:600;padding:3px 10px;border-radius:6px;border:1px solid transparent;}
  .iconbtn{width:29px;height:29px;border-radius:7px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);cursor:pointer;}
  .iconbtn.ok{color:var(--green);border-color:#cfe0d4;}
  .iconbtn.done{background:var(--green);color:#fff;border-color:var(--green);}
  .more{padding:12px 18px;text-align:center;font-size:12.5px;color:var(--accent);font-weight:600;cursor:pointer;border-top:1px solid var(--line);}
  .clockbar{margin-top:24px;display:flex;align-items:center;gap:16px;padding:12px 18px;background:#fff;border:1px solid #eef1f4;border-radius:10px;}
  .clockbar .c{font-size:12.5px;}

  /* vessel detail */
  .crumb{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer;margin-bottom:14px;}
  .vband{border-radius:13px;padding:20px 24px;margin-bottom:18px;border:1px solid;border-left-width:6px;}
  .subtabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid #e3e8ee;flex-wrap:wrap;}
  .subtab{font-size:13px;font-weight:500;color:var(--muted);padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px;}
  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:22px;}
  .grid11{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px;}
  .box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
  .box-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#aab2bd;margin-bottom:14px;}
  .vk{font-size:11px;color:var(--faint);margin-bottom:3px;}
  .map{position:relative;background:#e9eef3;border:1px solid var(--border);border-radius:12px;overflow:hidden;min-height:200px;background-image:repeating-linear-gradient(45deg,#e2e8ef 0,#e2e8ef 12px,#e9eef3 12px,#e9eef3 24px);display:flex;align-items:center;justify-content:center;}
  .pin{width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.2);}
  .pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px;}
  .pcard{background:#fff;border:1px solid var(--border);border-radius:11px;padding:14px 16px;cursor:pointer;}
  .pcard .pv{font-size:28px;font-weight:600;line-height:1;}
  .search{flex:1;min-width:220px;height:38px;border:1px solid #d8dee5;border-radius:8px;padding:0 14px;font-size:13px;color:var(--text);outline:none;}
  .stagechip{font-size:12px;font-weight:500;padding:7px 13px;border-radius:8px;cursor:pointer;border:1px solid var(--border);background:#f1f4f7;color:#475569;}
  .empty{padding:34px;text-align:center;color:var(--faint);font-size:13px;}
  @media(max-width:980px){
    .hero{grid-template-columns:1fr;} .fleet{grid-template-columns:1fr 1fr;}
    .grid2,.grid11{grid-template-columns:1fr;} .pipeline{grid-template-columns:repeat(2,1fr);}
    .nav-in{overflow-x:auto;} .wrap{padding:18px 16px 48px;}
  }
</style>
</head>
<body>
<div id="app"><div class="wrap"><div class="empty">Caricamento dashboard…</div></div></div>

<script>
"use strict";
/* ============================================================
   CONFIG — sorgenti dati (gli stessi workflow n8n → GitHub)
   ============================================================ */
const DATA_URLS = {
  procurement: "https://raw.githubusercontent.com/Micheledv74/maritime-dashboard/main/data-procurement.json",
  ais:         "https://raw.githubusercontent.com/Micheledv74/maritime-dashboard/main/data-ais.json",
  outlook:     "https://raw.githubusercontent.com/Micheledv74/maritime-dashboard/main/data-outlook-tasks.json"
};
// Certificati: come nell'app attuale vivono in localStorage ("mpd.certificates"),
// popolati dall'import Excel / sync Drive. Vengono letti se presenti.
const LS_CERTS = "mpd.certificates";
const LS_DONE  = "mpd.redesign.done";   // completamenti di QUESTA vista (non tocca le chiavi esistenti)

const VESSELS = [
  { id:"peppino",    name:"M/V PEPPINO", short:"PEPPINO", c:"#c8362f", soft:"#fbeae9", imo:"9999991", flag:"Italia",  type:"General Cargo" },
  { id:"medliguria", name:"MED LIGURIA", short:"LIGURIA", c:"#117a3a", soft:"#e6f3eb", imo:"9618372", flag:"Liberia", type:"Bulk Carrier" },
  { id:"medtoscana", name:"MED TOSCANA", short:"TOSCANA", c:"#1565c0", soft:"#e7f0fb", imo:"9999992", flag:"Liberia", type:"Bulk Carrier" },
  { id:"norrbotten", name:"NORRBOTTEN", short:"NORR", c:"#1a2c5e", soft:"#e7eaf1", imo:"9999993", flag:"Italia",  type:"Bulk Carrier" }
];
const VMAP = Object.fromEntries(VESSELS.map(v=>[v.id,v]));
// alcuni file usano "medtoscana" e "MED TOSCANA"; normalizzo gli id
function normId(id){ if(!id) return id; id=String(id).toLowerCase().replace(/\s+/g,""); if(id==="medtoscana")return"medtoscana"; if(id==="medliguria")return"medliguria"; return id; }

const TYPE_STYLE = {
  CONTROLLARE:{bg:"#fbe6c8",fg:"#9a4a00"}, VERIFICA:{bg:"#fbdcde",fg:"#8f1219"},
  SOLLECITA:{bg:"#dbe8ff",fg:"#0a3f93"}, "PRONTO PO":{bg:"#d4eedb",fg:"#145f1f"},
  CONTROLLA:{bg:"#ede4fb",fg:"#5b21b6"}, ALTRO:{bg:"#e9edf2",fg:"#475569"}
};
const STAGE_STYLE = {
  RFQ:{bg:"#dbe8ff",fg:"#0a3f93",label:"RFQ"}, PO:{bg:"#fbe6c8",fg:"#9a4a00",label:"ORDINE"},
  DN:{bg:"#ede4fb",fg:"#5b21b6",label:"DN"}, EVASO:{bg:"#d4eedb",fg:"#145f1f",label:"EVASO"},
  CANCEL:{bg:"#eef1f4",fg:"#94a0ad",label:"ANNULLATO"}
};

/* ============================================================ STATE */
const state = {
  view:"overview", vesselId:null, vfilter:"all",
  detailTab:"overview", itemStage:"all", itemSearch:"", certUrg:"all",
  proc:null, ais:null, outlook:null, certs:{}, done:{},
  loading:true, error:null, sources:{proc:false,ais:false,outlook:false}, lastSync:null
};
try{ state.done = JSON.parse(localStorage.getItem(LS_DONE)||"{}"); }catch(e){ state.done={}; }
try{ state.certs = JSON.parse(localStorage.getItem(LS_CERTS)||"{}"); }catch(e){ state.certs={}; }

/* ============================================================ FETCH */
async function loadData(){
  const get = (url)=>fetch(url,{cache:"no-store"}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); });
  const results = await Promise.allSettled([ get(DATA_URLS.procurement), get(DATA_URLS.ais), get(DATA_URLS.outlook) ]);
  if(results[0].status==="fulfilled"){ state.proc=results[0].value; state.sources.proc=true; state.lastSync=results[0].value.lastSync; }
  if(results[1].status==="fulfilled"){ state.ais=results[1].value; state.sources.ais=true; }
  if(results[2].status==="fulfilled"){ state.outlook=results[2].value; state.sources.outlook=true; }
  if(!state.proc){ state.proc=DEMO_PROC; state.lastSync=DEMO_PROC.lastSync; }
  if(!state.ais){ state.ais=DEMO_AIS; }
  state.loading=false;
}

/* ============================================================ HELPERS */
function vesselData(id){ return (state.proc&&state.proc.vessels||[]).find(v=>normId(v.vesselId)===normId(id)) || null; }
function aisData(id){ const a=state.ais&&state.ais.vessels; if(!a) return null; return a[id]||a[normId(id)]||Object.values(a).find(x=>normId(x.vesselId)===normId(id))||null; }
function timeAgo(iso){
  if(!iso) return "—"; const d=new Date(iso); const min=Math.floor((Date.now()-d.getTime())/60000);
  if(isNaN(min)) return "—"; if(min<1) return "ora"; if(min<60) return min+" min fa";
  const h=Math.floor(min/60); if(h<24) return h+(h===1?" ora fa":" ore fa"); const g=Math.floor(h/24); return g+(g===1?" giorno fa":" giorni fa");
}
function fmtDate(iso){ if(!iso||iso==="—") return "—"; const d=new Date(iso); if(isNaN(d)) return iso;
  const m=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"]; return d.getDate()+" "+m[d.getMonth()]; }
function navLabel(st,sog){ if(st===1) return "All'ancora"; if(st===5) return "Ormeggiata"; if(st===6) return "Incagliata";
  if(st===0) return (sog!=null&&sog<0.6)?"In sosta":"In navigazione"; return "—"; }
function coord(lat,lng){ if(lat==null||lng==null) return "—";
  return Math.abs(lat).toFixed(2)+"°"+(lat>=0?"N":"S")+" "+Math.abs(lng).toFixed(2)+"°"+(lng>=0?"E":"W"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function persistDone(){ try{ localStorage.setItem(LS_DONE, JSON.stringify(state.done)); }catch(e){} }

// stato pipeline da un item procurement
function stageOf(it){
  const rq=(it.reqStatus||""), po=(it.poStatus||""), dn=(it.dnStatus||"");
  if(rq.indexOf("Cancelled")>=0 || po.indexOf("Cancelled")>=0) return "CANCEL";
  if(dn.indexOf("Received on Board")>=0) return "EVASO";
  if(dn.indexOf("DN")>=0) return "DN";
  if(po.indexOf("PO")>=0) return "PO";
  return "RFQ";
}
// genera la lista azioni operative dai dati reali procurement
function deriveActions(){
  const out=[]; let n=0;
  for(const v of VESSELS){
    const vd=vesselData(v.id); if(!vd||!vd.items) continue;
    for(const it of vd.items){
      const rq=it.reqStatus||"", po=it.poStatus||"", dn=it.dnStatus||"", rfq=it.rfqStatus||"";
      if(rq.indexOf("Cancelled")>=0||po.indexOf("Cancelled")>=0) continue;
      if(dn.indexOf("Received on Board")>=0) continue; // evaso
      let type,lane,kind,verb;
      const overdue = (it.rfqDays||0)>30;
      if(po==="PO Published"){ type="VERIFICA"; lane="urgent"; kind=overdue?"scaduto":"week"; verb="Finalizza PO"; }
      else if(dn.indexOf("DN")>=0){ type="CONTROLLA"; lane="dn"; kind="some"; verb="Controlla consegna"; }
      else if(rfq==="RFQ Offer Acknowledged" && po===""){ type="PRONTO PO"; lane="po"; kind="some"; verb="Pronto per PO"; }
      else if(rq.indexOf("Price Sourcing")>=0 || rfq==="RFQ Sent to Vendor" || rfq==="RFQ Refused"){ type="SOLLECITA"; lane="solicit"; kind=overdue?"scaduto":"week"; verb="Sollecita RFQ"; }
      else continue;
      out.push({ id:v.id+"::"+(it.id||n), vk:v.id, type, lane, kind, verb,
        desc:verb+" · "+(it.description||"")+(it.supplier&&it.supplier!=="—"?" · "+it.supplier:""),
        when: kind==="scaduto"?"Scaduto":(kind==="week"?(it.rfqDays?it.rfqDays+"g":"settimana"):"quando puoi"),
        days: it.rfqDays||0 });
      n++;
    }
  }
  // ordino: scaduti prima, poi per rfqDays desc
  out.sort((a,b)=> (a.kind==="scaduto"?-1:0)-(b.kind==="scaduto"?-1:0) || b.days-a.days );
  return out;
}
function whenStyle(kind){
  if(kind==="scaduto") return "background:#c8222a;color:#fff;";
  if(kind==="week") return "background:#fff;color:#9a4a00;border-color:#f0cf9a;";
  return "background:#f1f4f7;color:#64748b;border-color:#e6eaef;";
}

// certificati per nave dal localStorage (best-effort sui nomi campo)
function certsForVessel(id){
  const raw = state.certs && (state.certs[id]||state.certs[normId(id)]); if(!Array.isArray(raw)) return [];
  return raw.map(c=>{
    const name = c.name||c.certificato||c.certificate||c.title||c.descrizione||"—";
    let days = c.days!=null?c.days : (c.daysLeft!=null?c.daysLeft : (c.restano!=null?c.restano : null));
    let exp  = c.expiry||c.scadenza||c.expiryDate||c.dueDate||c.date||"";
    if(days==null && exp){ const d=new Date(exp); if(!isNaN(d)) days=Math.round((d.getTime()-Date.now())/86400000); }
    return { name, days: days==null?9999:days, expiry: exp?fmtDate(exp):"—" };
  });
}
function certBadge(days){
  if(days<0) return {restano:days+"g", style:"background:#c8222a;color:#fff;", urg:"expired"};
  if(days<=30) return {restano:days+"g", style:"background:#fff;color:#9a4a00;border-color:#f0cf9a;", urg:"urgent"};
  if(days<=60) return {restano:days+"g", style:"background:#fffbe9;color:#7a6a1a;border-color:#ecdf9a;", urg:"soon"};
  if(days>=9999) return {restano:"—", style:"background:#f1f4f7;color:#94a0ad;", urg:"ok"};
  return {restano:days+"g", style:"background:#eef3fb;color:#0a3f93;border-color:#d6e4fb;", urg:"ok"};
}
function allCerts(){
  const out=[]; for(const v of VESSELS){ for(const c of certsForVessel(v.id)){ out.push({...c, vk:v.id}); } } return out;
}

/* ============================================================ RENDER */
const app = ()=>document.getElementById("app");
function go(view){ state.view=view; state.vfilter="all"; state.certUrg="all"; render(); }
function openVessel(id){ state.view="vessel"; state.vesselId=id; state.detailTab="overview"; state.itemStage="all"; state.itemSearch=""; render(); window.scrollTo(0,0); }
function setFilter(id){ if(state.view!=="overview"&&state.view!=="todos"&&state.view!=="certs"){ state.view="overview"; state.vfilter=id; } else { state.vfilter = state.vfilter===id?"all":id; } render(); }
function toggleDone(id){ if(state.done[id]) delete state.done[id]; else state.done[id]=true; persistDone(); render(); }

function header(){
  let cls="ok",txt="Sync —";
  if(state.lastSync){ const a=timeAgo(state.lastSync); txt="Sync "+a; const min=(Date.now()-new Date(state.lastSync).getTime())/60000; cls=min>180?"warn":"ok"; }
  if(!state.sources.proc){ cls="err"; txt="Dati demo (offline)"; }
  const now=new Date(); const dd=now.toLocaleDateString("it-IT",{weekday:"short",day:"2-digit",month:"short"});
  const hh=now.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
  return `<div class="hd"><div class="hd-in">
    <div class="logo" onclick="go('overview')"><div class="logo-mark">⚓</div><span style="font-size:16px;font-weight:700;">Maritime</span><span style="font-size:10.5px;font-weight:600;letter-spacing:.13em;color:#9aa3af;">PROCUREMENT</span></div>

function worldClock(){

    const h=parseInt(t)||0; const day=h>=7&&h<19; return `<span class="c mono" style="color:${day?'#374151':'#9aa3af'};"><span style="color:#aab2bd;font-weight:600;">${code}</span> ${t}</span>`; }).join("");
}

          ${["Master","Chief Eng.","Inspector"].map(r=>`<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f3f5f8;"><span style="font-size:11px;font-weight:600;color:${v.c};width:80px;">${r}</span><span style="font-size:13px;">—</span><span style="margin-left:auto;font-size:12px;color:#0e54c1;cursor:pointer;">✉ contatto</span></div>`).join("")}
        </div>
        <div class="box"><div class="box-h">Risorse nave</div>
          <div style="display:flex;flex-direction:column;gap:9px;">
            <div style="display:flex;align-items:center;gap:10px;font-size:13px;color:#3a4250;cursor:pointer;"><span style="width:26px;height:26px;border-radius:7px;background:#eaf1fc;display:flex;align-items:center;justify-content:center;">📁</span>Cartella Drive · ${v.name}</div>
            <div style="display:flex;align-items:center;gap:10px;font-size:13px;color:#3a4250;cursor:pointer;"><span style="width:26px;height:26px;border-radius:7px;background:#f3f3f3;display:flex;align-items:center;justify-content:center;">📝</span>Pagina Notion</div>
            <div style="display:flex;align-items:center;gap:10px;font-size:13px;color:#3a4250;cursor:pointer;"><span style="width:26px;height:26px;border-radius:7px;background:#e6f3eb;display:flex;align-items:center;justify-content:center;">🚢</span>Record Infoship</div>
          </div></div>
      </div>`;
  } else if(dt==="proc"){
    const counts2={RFQ:0,PO:0,DN:0,EVASO:0,CANCEL:0}; items.forEach(it=>counts2[stageOf(it)]++);

        <span style="min-width:0;"><div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(it.description)}</div><div class="mono" style="font-size:10.5px;color:#aab2bd;">${esc((it.reqStatus||"")+(it.poStatus?" · "+it.poStatus:""))}</div></span>

        <span style="text-align:right;"><span style="font-size:13px;color:#6b7280;cursor:pointer;">↗</span></span></div>`;}).join("")

    bodyHTML=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;">

  } else if(dt==="todo"){
    const body=vActs.length?vActs.map(a=>{const t=TYPE_STYLE[a.type]||TYPE_STYLE.ALTRO;const done=!!state.done[a.id];
      return `<div class="arow" style="display:grid;grid-template-columns:120px minmax(0,1fr) 128px 72px;column-gap:14px;padding:11px 18px 11px 15px;border-left:3px solid ${v.c};opacity:${done?.4:1};">

        <span><span class="whenb" style="${whenStyle(a.kind)}">${esc(a.when)}</span></span>
        <span style="display:flex;gap:6px;justify-content:flex-end;"><span class="iconbtn ${done?'done':'ok'}" onclick="toggleDone('${a.id}')">✓</span><span class="iconbtn">↗</span></span></div>`;}).join("")
      :`<div class="empty">Nessuna azione aperta per ${v.name}.</div>`;
    bodyHTML=`<div class="panel"><div style="display:grid;grid-template-columns:120px minmax(0,1fr) 128px 72px;column-gap:14px;padding:9px 18px;background:#fafbfc;border-bottom:1px solid #eef1f4;"><span class="ghead">Tipo</span><span class="ghead">Azione</span><span class="ghead">Scadenza</span><span></span></div>${body}</div>`;
  }

  return `<div class="wrap">
    <div class="crumb" onclick="go('overview')">← Flotta</div>
    <div class="vband" style="background:${v.soft};border-color:${v.c}33;border-left-color:${v.c};">
      <div style="display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;">
        <div style="flex:1;min-width:260px;"><div style="display:flex;align-items:center;gap:12px;margin-bottom:5px;"><span style="font-size:24px;font-weight:700;letter-spacing:-.02em;color:${v.c};">${v.name}</span><span class="vstate" style="background:${stBg};color:${stFg};">${stateLbl}</span></div>
          <div style="font-size:13px;color:#5b6470;">${v.type} · IMO ${v.imo} · ${v.flag}</div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn" style="background:${v.c};border-color:${v.c};color:#fff;font-weight:600;">Apri in Infoship ↗</button>
          <button class="btn">Drive</button><button class="btn">Notion</button><button class="btn">Esporta PDF</button></div>
      </div></div>
    <div class="subtabs">${tab("overview","Panoramica","")}${tab("proc","Procurement",counts.proc)}${tab("cert","Certificati",counts.cert)}${tab("todo","To-do",counts.todo)}</div>
    ${bodyHTML}
  </div>`;
}

function render(){
  let body="";
  if(state.loading){ body=`<div class="wrap"><div class="empty">Caricamento dashboard…</div></div>`; }
  else if(state.view==="overview") body=overview();
  else if(state.view==="todos") body=todosPage();
  else if(state.view==="certs") body=certsPage();
  else if(state.view==="vessel") body=vesselDetail();
  app().innerHTML = header()+nav()+body;
}
// aggiornamento parziale tabella items (per non perdere il focus della ricerca)
function renderItemsOnly(){
  const v=VMAP[state.vesselId]; const d=vesselData(state.vesselId); const items=(d&&d.items)||[];
  const q=(state.itemSearch||"").toLowerCase();
  let rows=items.filter(it=>state.itemStage==="all"||stageOf(it)===state.itemStage);
  if(q) rows=rows.filter(it=>((it.description||"")+" "+(it.supplier||"")+" "+(it.id||"")).toLowerCase().includes(q));
  const el=document.getElementById("items-body"); if(!el) return;
  el.innerHTML = rows.length?rows.map(it=>{const s=STAGE_STYLE[stageOf(it)];
    return `<div class="arow" style="display:grid;grid-template-columns:minmax(0,2.4fr) 1.3fr 150px 90px 64px;column-gap:14px;padding:11px 18px 11px 15px;border-left:3px solid ${v.c};">
      <span style="min-width:0;"><div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(it.description)}</div><div class="mono" style="font-size:10.5px;color:#aab2bd;">${esc((it.reqStatus||"")+(it.poStatus?" · "+it.poStatus:""))}</div></span>
      <span style="font-size:12.5px;color:#5b6470;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(it.supplier)}</span>
      <span><span class="tchip" style="background:${s.bg};color:${s.fg};">${s.label}</span></span>
      <span class="mono" style="font-size:11.5px;color:#6b7280;">${fmtDate(it.deliveryDate)}</span>
      <span style="text-align:right;"><span style="font-size:13px;color:#6b7280;cursor:pointer;">↗</span></span></div>`;}).join("")
    :`<div class="empty">Nessun articolo per questo filtro.</div>`;
}
